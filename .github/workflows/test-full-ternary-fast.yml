name: Fast full-ternary-QAT checks

on:
  push:
    branches: ["**"]
    paths:
      - "smaulbrain/**"
      - "tests/test_quant.py"
      - "tests/test_p0_hotpaths.py"
      - "tests/test_routing_paging.py"
      - "tests/test_native_optimizer.py"
      - "tests/test_model_moe_capacity.py"
      - "tests/test_checkpoint_integrity.py"
      - "train.py"
      - "infer.py"
      - ".github/workflows/test-full-ternary-fast.yml"
  pull_request:
    paths:
      - "smaulbrain/**"
      - "tests/test_quant.py"
      - "tests/test_p0_hotpaths.py"
      - "tests/test_routing_paging.py"
      - "tests/test_native_optimizer.py"
      - "tests/test_model_moe_capacity.py"
      - "tests/test_checkpoint_integrity.py"
      - "train.py"
      - "infer.py"
      - ".github/workflows/test-full-ternary-fast.yml"

permissions:
  contents: read

jobs:
  fast-ternary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile current Python package and entry points
        run: python -m compileall -q smaulbrain train.py infer.py evaluate.py prune.py bench.py bench_router.py
      - name: Run focused quantization, routing, optimizer, and recovery tests
        env:
          PYTHONFAULTHANDLER: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: >-
          python -m pytest -q
          tests/test_quant.py
          tests/test_p0_hotpaths.py
          tests/test_routing_paging.py
          tests/test_native_optimizer.py
          tests/test_model_moe_capacity.py
          tests/test_checkpoint_integrity.py
