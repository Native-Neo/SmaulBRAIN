name: Full test suite

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  # Push and pull_request events for the same PR branch share one suite.
  group: full-test-suite-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Benchmark CLI smoke test
        run: >-
          python benchmarks/bench.py --steps 1 --d-model 32 --experts 2
          --top-k 1 --expert-hidden 32 --context-length 16 --batch-size 1
          --max-params 1000000
      - name: Run full regression suite
        env:
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest -q
