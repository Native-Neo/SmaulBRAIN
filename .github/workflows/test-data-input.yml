name: Dataset input tests

on:
  pull_request:
    paths:
      - "data_input.py"
      - "tests/test_data_input.py"
      - ".github/workflows/test-data-input.yml"
  push:
    branches: [main]
    paths:
      - "data_input.py"
      - "tests/test_data_input.py"
      - ".github/workflows/test-data-input.yml"

jobs:
  test-data-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyarrow
      - name: Test dataset file and directory loading
        run: python -m pytest -q tests/test_data_input.py
