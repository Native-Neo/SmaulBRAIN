name: CPU ternary-QAT full-preset smoke profile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bench.py"
      - "smaulbrain/**"
      - "tests/test_quant.py"
      - ".github/workflows/profile-full-ternary.yml"
  push:
    branches: ["**"]
    paths:
      - "bench.py"
      - "smaulbrain/**"
      - "tests/test_quant.py"
      - ".github/workflows/profile-full-ternary.yml"

permissions:
  contents: read

concurrency:
  group: ternary-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-full-cpu:
    name: Full preset ternary forward/decode profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile the current PyTorch package
        run: python -m compileall -q smaulbrain train.py infer.py evaluate.py prune.py bench.py
      - name: Profile full-preset ternary forward and decode
        run: >-
          python -u bench.py --preset moe-full --seq-len 128
          --forward-quant ternary --backward-mode ternary
          --repeat 1 --max-new-tokens 1 --out ternary-profile-report.json
      - name: Upload operator and memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ternary-full-preset-profile
          path: ternary-profile-report.json
          if-no-files-found: warn
          retention-days: 14
