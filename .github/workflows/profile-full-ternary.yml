name: Profile full ternary-QAT CPU training

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/profile_full_ternary.py"
      - ".github/workflows/profile-full-ternary.yml"
      - "experts.py"
      - "model.py"
      - "train.py"
      - "smaulopt.py"
      - "native.py"
      - "config.py"
      - "kernels_cpp/**"
      - "tests/test_expert_memory.py"
  push:
    branches: ["**"]
    paths:
      - "benchmarks/profile_full_ternary.py"
      - ".github/workflows/profile-full-ternary.yml"
      - "experts.py"
      - "model.py"
      - "train.py"
      - "smaulopt.py"
      - "native.py"
      - "config.py"
      - "kernels_cpp/**"
      - "tests/test_expert_memory.py"

permissions:
  contents: read

concurrency:
  group: full-ternary-profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-full-cpu:
    # This experiment uses the tiny correctness tests; do not start the
    # full 2x1024-token/64-expert training profile on every code push here.
    # Keep the full profile enabled for main and other branches.
    if: github.ref != 'refs/heads/experiment/full-ternary-qat' && github.head_ref != 'experiment/full-ternary-qat'
    name: Full (512-wide, 64 experts) ternary-QAT training profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      SMAUL_PROFILE_THREADS: "2"
      PYTHONFAULTHANDLER: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Profile one full-size training step
        run: python -u benchmarks/profile_full_ternary.py
      - name: Upload operator and memory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-ternary-cpu-profile
          path: ternary-profile-report.json
          if-no-files-found: warn
          retention-days: 14
